<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Empresa — ScoreInvest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body id="body-cadastro-login">

    <div>
        <div class="card-cadastro-login">
            <a href="index.html">
                <i class="fa-solid fa-arrow-left" style="font-size:22px ;"></i>
            </a>
            <h1>Cadastre sua empresa</h1>
            <p class="sub">Vincule sua empresa para começar a organizar os dados financeiros</p>

            <form>
                <div class="field">
                    <label for="nomeEmpresa">Nome da empresa</label>
                    <input type="text" id="ipt_empresa" placeholder="Ex: LSD Investimentos" required>
                </div>
                <div class="field">
                    <label for="emailEmpresarial">E-mail Empresarial</label>
                    <input type="email" id="ipt_emailEmpresarial" placeholder="contato@suaempresa.com" required>
                </div>
                <div class="field">
                    <label for="senha">CNPJ</label>
                <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required maxlength="18" inputmode="numeric">

                </div>
        
                <button type="button" class="btn-primary-cadastro-login" onclick="cadastrarEmpresa()"> Cadastrar Empresa</button>
            </form>
            <div class="switch">
                <a href="index.html">Fazer isso mais tarde...</a>
            </div>
        </div>
    </div>
       
</body>
</html>
